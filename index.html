<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Map</title>
    <meta name="description" content="The MaCAD thesis research map: question, hypothesis, groups, papers, ideas and builds." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" />
    <link rel="stylesheet" href="assets/map.css" />
    <link rel="stylesheet" href="assets/reader.css" />
    <script>
      // The saved theme before first paint (assets/theme.js does the same), so a dark choice never flashes light.
      try {
        const t = localStorage.getItem('research-map-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { start } from './assets/view.js'
      // ?dir=tests/fixture/ opens the sample map instead of the real one.
      const dir = new URLSearchParams(location.search).get('dir') ?? ''
      start(document.getElementById('app'), { dir })
    </script>
  </body>
</html>
